name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Generates Next's route types first, then runs tsc.
      - name: Type check
        run: npm run typecheck

      # The tests never touch the network: fetch is always a stand-in.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      # Drives the production build in a real browser. Outside APIs are
      # replaced with stand-ins, so these do not depend on the network either.
      - name: End-to-end tests
        run: npm run e2e

      - name: Keep the traces of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Docker and Kubernetes are not installed on the machine this project is
  # written on, so this job is where both are proven: the image is built,
  # started and asked to answer, then run on a real cluster from the manifest.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t flowboard:ci .

      - name: Start a container and wait until it is healthy
        run: |
          docker run -d --name flowboard -p 3000:3000 flowboard:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' flowboard)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          docker logs flowboard
          exit 1

      - name: Ask it for the pages and the REST routes
        run: |
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent http://localhost:3000/api/templates | grep -q '"heat-check"'
          curl --fail --silent --output /dev/null http://localhost:3000/
          test "$(docker exec flowboard whoami)" = "flowboard"

      # Checks the shape of the manifest against the Kubernetes schemas.
      - name: Validate the Kubernetes manifest
        run: docker run --rm -v "$PWD/deploy:/deploy" ghcr.io/yannh/kubeconform:latest -strict -summary /deploy/k8s.yaml

      # The shape being right does not mean the pods start. kind runs a real
      # Kubernetes cluster inside Docker, so the manifest is applied for real:
      # the pods have to start under its security settings and pass its probes.
      - name: Start a one-node Kubernetes cluster
        run: |
          if ! command -v kind >/dev/null; then
            curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
            chmod +x kind && sudo mv kind /usr/local/bin/kind
          fi
          kind create cluster --wait 120s

      - name: Apply the manifest and wait for both copies to be ready
        run: |
          docker tag flowboard:ci flowboard:local
          kind load docker-image flowboard:local
          kubectl apply -f deploy/k8s.yaml
          if ! kubectl rollout status deployment/flowboard --timeout=180s; then
            kubectl describe pods -l app=flowboard
            kubectl logs -l app=flowboard --tail=50 || true
            exit 1
          fi
          test "$(kubectl get deployment flowboard -o jsonpath='{.status.readyReplicas}')" = "2"

      - name: Call the app through the Service
        run: |
          kubectl port-forward service/flowboard 8080:80 >/dev/null 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null http://localhost:8080/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8080/api/health
          curl --fail --silent http://localhost:8080/api/templates | grep -q '"heat-check"'
          # Neither copy runs as root.
          for pod in $(kubectl get pods -l app=flowboard -o name); do
            test "$(kubectl exec "$pod" -- id -u)" = "10001"
          done
